# Companies House — answer sheet in schema form.
#
# Transcribed from siy/derivation-artifacts runs/companies-house/ANSWER-SHEET.md.
# The published sheet is prose; this is its machine form, and the transcript's recorded
# moves are the acceptance test (see companies-house.expected.js).
#
# Where the sheet says UNKNOWN, this file says UNKNOWN. Nothing is filled in to make the
# sheet look complete: "an honest UNKNOWN derives a null position and a note, which
# beats a confident guess deriving machinery" (answer-sheet.md:67).

schema_version = "0.1"

[meta]
system = "companies-house"
era    = "2024-2025"
author = "siy"
mode   = "greenfield"
source = "Companies House annual report and accounts 2024-2025"

# ---- Q1 Time budget ----
# Every deadline on this sheet binds the REQUESTER's clock (statutory windows), which
# Card 3 marks inert. None is a system response target.

[[answers.q1]]
scope     = "operation:file-confirmation-statement"
statement = "Statutory: before the end of 14 days after the end of each review period (CA2006 s.853A). Requester's clock."
shape     = "requester-clock"
price     = "late filing penalty; appealable"
status    = "answered"
source    = "CA2006 s.853A"

[[answers.q1]]
scope     = "operation:file-accounts"
statement = "Statutory penalty ladder: up to 1 month GBP 150, more than 6 months GBP 1,500. Requester's clock."
shape     = "requester-clock"
price     = "GBP 150 to GBP 1,500 penalty, appealable"
status    = "answered"

[[answers.q1]]
scope     = "operation:incorporate-company"
statement = "Usually registered within 24 hours online; 8 to 10 days by post. Target over physics floor is nowhere near 1."
shape     = "requester-clock"
price     = "no stated consequence past the window"
status    = "answered"

[[answers.q1]]
scope     = "operation:registrar-query-decision"
statement = "UNKNOWN: no statutory turnaround time is published for registrar query or reject decisions."
status    = "UNKNOWN"

