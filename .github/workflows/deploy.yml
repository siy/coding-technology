name: Deploy to Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The site build renders markdown with pandoc (website/lib/render.js), so
      # pandoc is a hard build dependency. Pinned to an exact version and
      # checksum-verified: an unpinned build tool is the same supply-chain
      # problem the npm dependencies were removed to avoid. Digest and size
      # read from the release API for this exact asset.
      - name: Install pandoc (pinned, checksum-verified)
        run: |
          set -euo pipefail
          PANDOC_VERSION=3.8.3
          PANDOC_DEB="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          PANDOC_SHA256=d7fac78b58b8c8da39254955eff321233ab97d74e8b2d461c0f0719a1fb5f357
          curl --fail --silent --show-error --location \
            --output "$PANDOC_DEB" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${PANDOC_DEB}"
          echo "${PANDOC_SHA256}  ${PANDOC_DEB}" | sha256sum --check --strict -
          sudo dpkg --install "$PANDOC_DEB"
          rm -f "$PANDOC_DEB"
          # The pin is only a pin if a different version fails here.
          pandoc --version | head -1
          test "$(pandoc --version | head -1)" = "pandoc ${PANDOC_VERSION}"

      - name: Install dependencies
        working-directory: ./website
        run: npm install

      - name: Build website
        working-directory: ./website
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './website/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.event.head_commit.message }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
