cadence   = "independent"
status    = "answered"

[[answers.q7]]
scope     = "unit:lending"
statement = "Lending releases on its own schedule, gated by credit-risk review."
cadence   = "weekly"
status    = "answered"

[[answers.q8]]
scope     = "system"
statement = "Several hundred engineers with a dedicated platform team operating shared infrastructure."
status    = "answered"

[[answers.q9]]
scope     = "system"
statement = "One currency, one regulatory regime, one region."
status    = "answered"

[[domain_shape]]
operation   = "authorise-payment"
inverse     = "reverse the authorisation"
decays      = false
reshapeable = ["none"]

[[domain_shape]]
operation   = "post-ledger-entry"
inverse     = "none: corrected by a compensating entry"
decays      = false
reshapeable = ["append-only"]

[[domain_shape]]
operation   = "update-activity-feed"
inverse     = "none"
decays      = true
reshapeable = ["none"]
