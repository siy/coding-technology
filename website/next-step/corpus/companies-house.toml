# ---- Q4 Consistency contract ----

[[answers.q4]]
scope     = "data-class:filings"
statement = "The registrar does not verify information for accuracy, accepting in good faith with only limited examination checks. An RP04 correction layers a new record; the original incorrect form remains on the register."
status    = "answered"

[[answers.q4]]
scope     = "path:public-search"
statement = "UNKNOWN: no public statement on acceptable staleness between an accepted filing and its visibility in public search."
status    = "UNKNOWN"

# ---- Q5 Load ----

[[answers.q5]]
scope     = "path:public-search"
statement = "Register accessed 16.3 billion times; read to write on the order of 1,000 to 1."
shape     = "volume"
read_model = "diverges"   # public search is redacted relative to the record of truth
status    = "answered"

[[answers.q5]]
scope     = "path:accounts-filing"
statement = "December accounts deadline peak: 503 filings inside the final hour, 28,874 missed the cut-off entirely. No stated synchronous latency target on the intake path."
shape     = "burst"
status    = "answered"

[[answers.q5]]
scope     = "path:confirmation-statement-filing"
statement = "Confirmation statements are not calendar-concentrated; 14.7m filings accepted in the year, 91.5% digital."
shape     = "volume"
status    = "answered"

[[answers.q5]]
scope     = "path:bulk-data-export"
statement = "Bulk export serves whole-register extracts, a read model that diverges from the transactional record."
shape     = "volume"
read_model = "diverges"   # whole-register extract is not a transactional read
status    = "answered"

# ---- Q6 External constraints ----

[[answers.q6]]
scope     = "data-class:register"
kind      = "audit"
statement = "Statutory publication duty (CA2006 Part 35): who filed what and when. No demand anywhere on the sheet to reconstruct state as of a past rule version."
status    = "answered"

[[answers.q6]]
scope     = "data-class:personal-data"
kind      = "mandate"
statement = "ECCTA bars publication of date of birth; the public-search read shape is redacted relative to the record of truth."
reshapes_read = true
status    = "answered"

[[answers.q6]]
scope     = "data-class:register"
kind      = "residency"
statement = "GDPR Article 49(1)(g) public-register transfer exemption applies, which removes the residency pressure rather than creating one."
status    = "answered"

